<h1>编程展示网站</h1>
<pre><h3>    可以校准时间的钟</h3></pre>
<pre>
<textarea readonly style="width:100%; height:300px; font-family:monospace; font-size:14px; background:black; border:none; resize:none; margin-left:4em;">
#include &lt;bits/stdc++.h&gt;
#include &lt;chrono&gt;
#include &lt;conio.h&gt;
#include &lt;ws2tcpip.h&gt;
#include &lt;windows.h&gt;
using namespace std;

string path="ntp.aliyun.com";

time_t NTP(){
    WSADATA w;
    if(WSAStartup(MAKEWORD(2,2),&amp;w))return 0;
    SOCKET s=socket(AF_INET,SOCK_DGRAM,IPPROTO_UDP);
    if(s==INVALID_SOCKET){WSACleanup();return 0;}
    int t=5000;
    setsockopt(s,SOL_SOCKET,SO_RCVTIMEO,(char*)&amp;t,sizeof(t));
    sockaddr_in a;
    a.sin_family=AF_INET;
    a.sin_port=htons(123);
    hostent* h=gethostbyname(path.c_str());
    if(!h){closesocket(s);WSACleanup();return 0;}
    memcpy(&amp;a.sin_addr,h-&gt;h_addr,h-&gt;h_length);
    unsigned char p[48]={0};
    p[0]=0x1B;
    if(sendto(s,(char*)p,48,0,(sockaddr*)&amp;a,sizeof(a))==SOCKET_ERROR){closesocket(s);WSACleanup();return 0;}
    int l=sizeof(a);
    if(recvfrom(s,(char*)p,48,0,(sockaddr*)&amp;a,&amp;l)==SOCKET_ERROR){closesocket(s);WSACleanup();return 0;}
    closesocket(s);
    WSACleanup();
    unsigned long n=(p[40]&lt;&lt;24)|(p[41]&lt;&lt;16)|(p[42]&lt;&lt;8)|p[43];
    return(time_t)(n-2208988800UL);
}

bool SetTime(time_t t){
    tm* tm=gmtime(&amp;t);
    SYSTEMTIME s;
    s.wYear=tm-&gt;tm_year+1900;
    s.wMonth=tm-&gt;tm_mon+1;
    s.wDay=tm-&gt;tm_mday;
    s.wHour=tm-&gt;tm_hour;
    s.wMinute=tm-&gt;tm_min;
    s.wSecond=tm-&gt;tm_sec;
    s.wMilliseconds=0;
    s.wDayOfWeek=0;
    return SetSystemTime(&amp;s)!=0;
}

void jz(){
    time_t t=NTP();
    string a=",网站:"+path; 
    if(t&lt;=0){MessageBox(NULL,("校准失败,请检查网络"+a).c_str(),"错误",MB_OK|MB_ICONSTOP);return;}
    tm* l=localtime(&amp;t);
    SetTime(t)?MessageBox(NULL,("校准成功"+a).c_str(),"提示",MB_OK|MB_ICONINFORMATION):MessageBox(NULL,("校准失败"+a).c_str(),"错误",MB_OK|MB_ICONSTOP);
}

void t1(){
    while(1){
        if(_kbhit()){
            char a=_getch();
            if(a=='q')exit(0);
            if(GetAsyncKeyState(VK_CONTROL)&amp;0x8000){
                if(GetAsyncKeyState(VK_F5)&amp;0x8000){
                    jz();
                }
            }
        }
        Sleep(250);
    }
}

int main(){
    thread t(t1);
    t.detach();
    while(_kbhit())_getch();
    while(1){
        auto now=chrono::system_clock::now();
        time_t tt=chrono::system_clock::to_time_t(now);
        tm* local=localtime(&amp;tt);
        cout&lt;&lt;"\r"&lt;&lt;setw(4)&lt;&lt;setfill('0')&lt;&lt;local-&gt;tm_year+1900&lt;&lt;"-"&lt;&lt;setw(2)&lt;&lt;setfill('0')&lt;&lt;local-&gt;tm_mon+1&lt;&lt;"-"&lt;&lt;setw(2)&lt;&lt;setfill('0')&lt;&lt;local-&gt;tm_mday&lt;&lt;string(2,' ')&lt;&lt;setw(2)&lt;&lt;setfill('0')&lt;&lt;local-&gt;tm_hour&lt;&lt;":"&lt;&lt;setw(2)&lt;&lt;setfill('0')&lt;&lt;local-&gt;tm_min &lt;&lt; ":"&lt;&lt;setw(2)&lt;&lt;setfill('0')&lt;&lt;local-&gt;tm_sec;
        Sleep(1000);
    }
    return 0;
}
