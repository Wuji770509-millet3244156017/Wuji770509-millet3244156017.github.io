<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netlify 全球聊天室</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: #f0f2f5; height: 100vh; display: flex; justify-content: center; align-items: center; }
        .chat-container { width: 100%; max-width: 600px; height: 90vh; background: #fff; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); display: flex; flex-direction: column; overflow: hidden; }
        .header { background: #007bff; color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; font-weight: bold; }
        .nickname-input { border: none; border-radius: 5px; padding: 5px 10px; font-size: 14px; outline: none; width: 100px; }
        .chat-box { flex: 1; padding: 20px; overflow-y: auto; background: #e5ddd5; display: flex; flex-direction: column; gap: 15px; }
        .message { max-width: 75%; display: flex; flex-direction: column; }
        .message.self { align-self: flex-end; align-items: flex-end; }
        .message.other { align-self: flex-start; align-items: flex-start; }
        .msg-info { font-size: 12px; color: #666; margin-bottom: 5px; }
        .msg-bubble { padding: 10px 15px; border-radius: 15px; font-size: 15px; word-wrap: break-word; line-height: 1.4; }
        .message.self .msg-bubble { background-color: #dcf8c6; border-bottom-right-radius: 2px; }
        .message.other .msg-bubble { background-color: #fff; border-bottom-left-radius: 2px; }
        .input-area { padding: 15px; background: #fff; display: flex; gap: 10px; border-top: 1px solid #ddd; }
        .input-area input { flex: 1; padding: 12px 15px; border: 1px solid #ccc; border-radius: 25px; outline: none; font-size: 15px; }
        .input-area button { background: #007bff; color: white; border: none; border-radius: 25px; padding: 0 20px; font-size: 15px; cursor: pointer; }
        .input-area button:hover { background: #0056b3; }
    </style>
</head>
<body>
<div class="chat-container">
    <div class="header">
        <div>全球交流大厅</div>
        <div>昵称: <input type="text" id="myNickname" class="nickname-input" placeholder="输入昵称" value="访客"></div>
    </div>
    <div class="chat-box" id="chatBox"></div>
    <div class="input-area">
        <input type="text" id="msgInput" placeholder="输入消息，按回车发送..." autocomplete="off">
        <button onclick="sendMessage()">发送</button>
    </div>
</div>

<!-- 引入 Firebase SDK -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getDatabase, ref, push, onChildAdded } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

    // ==========================================================
    // ⚠️ 请把你从 Firebase 获取的配置复制粘贴到下面覆盖掉默认的！
    // ==========================================================
    const firebaseConfig = {
        apiKey: "AIzaSy...",
        authDomain: "your-project.firebaseapp.com",
        databaseURL: "https://your-project-default-rtdb.firebaseio.com",
        projectId: "your-project",
        storageBucket: "your-project.appspot.com",
        messagingSenderId: "123456789",
        appId: "1:1234..."
    };

    // 初始化 Firebase
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const chatRef = ref(db, 'messages');

    const chatBox = document.getElementById('chatBox');
    const msgInput = document.getElementById('msgInput');
    const myNickname = document.getElementById('myNickname');

    // 监听回车发送
    msgInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') sendMessage();
    });

    // 发送消息
    window.sendMessage = function() {
        const text = msgInput.value.trim();
        if (!text) return;
        const name = myNickname.value.trim() || '匿名';

        // 推送到 Firebase 实时数据库
        push(chatRef, {
            name: name,
            text: text,
            time: new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' })
        });

        msgInput.value = '';
    }

    // 接收实时消息
    onChildAdded(chatRef, (snapshot) => {
        const data = snapshot.val();
        const isSelf = (data.name === myNickname.value.trim());

        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${isSelf ? 'self' : 'other'}`;
        msgDiv.innerHTML = `
            <div class="msg-info">${data.name} • ${data.time}</div>
            <div class="msg-bubble">${escapeHTML(data.text)}</div>
        `;
        
        chatBox.appendChild(msgDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
    });

    // 防XSS注入
    function escapeHTML(str) {
        return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
    }
</script>
</body>
</html>
