<pre><h3>    可以校准时间的钟</h3><pre>
<pre>
<textarea readonly style="width:100%; height:300px; font-family:monospace; font-size:14px; background:black; border:none; resize:none; margin-left:4em;">
#include <bits/stdc++.h>
#include <chrono>
#include <conio.h>
#include <ws2tcpip.h>
#include <windows.h>
using namespace std;

string path="ntp.aliyun.com";

time_t NTP(){
    WSADATA w;
    if(WSAStartup(MAKEWORD(2,2),&w))return 0;
    SOCKET s=socket(AF_INET,SOCK_DGRAM,IPPROTO_UDP);
    if(s==INVALID_SOCKET){WSACleanup();return 0;}
    int t=5000;
    setsockopt(s,SOL_SOCKET,SO_RCVTIMEO,(char*)&t,sizeof(t));
    sockaddr_in a;
    a.sin_family=AF_INET;
    a.sin_port=htons(123);
    hostent* h=gethostbyname(path.c_str());
    if(!h){closesocket(s);WSACleanup();return 0;}
    memcpy(&a.sin_addr,h->h_addr,h->h_length);
    unsigned char p[48]={0};
    p[0]=0x1B;
    if(sendto(s,(char*)p,48,0,(sockaddr*)&a,sizeof(a))==SOCKET_ERROR){closesocket(s);WSACleanup();return 0;}
    int l=sizeof(a);
    if(recvfrom(s,(char*)p,48,0,(sockaddr*)&a,&l)==SOCKET_ERROR){closesocket(s);WSACleanup();return 0;}
    closesocket(s);
    WSACleanup();
    unsigned long n=(p[40]<<24)|(p[41]<<16)|(p[42]<<8)|p[43];
    return(time_t)(n-2208988800UL);
}

bool SetTime(time_t t){
    tm* tm=gmtime(&t);
    SYSTEMTIME s;
    s.wYear=tm->tm_year+1900;
    s.wMonth=tm->tm_mon+1;
    s.wDay=tm->tm_mday;
    s.wHour=tm->tm_hour;
    s.wMinute=tm->tm_min;
    s.wSecond=tm->tm_sec;
    s.wMilliseconds=0;
    s.wDayOfWeek=0;
    return SetSystemTime(&s)!=0;
}

void jz(){
    time_t t=NTP();
    string a=",网站:"+path; 
    if(t<=0){MessageBox(NULL,("校准失败,请检查网络"+a).c_str(),"错误",MB_OK|MB_ICONSTOP);return;}
    tm* l=localtime(&t);
    SetTime(t)?MessageBox(NULL,("校准成功"+a).c_str(),"提示",MB_OK|MB_ICONINFORMATION):MessageBox(NULL,("校准失败"+a).c_str(),"错误",MB_OK|MB_ICONSTOP);
}

void t1(){
	while(1){
		if(_kbhit()){
    		char a=_getch();
    		if(a=='q')exit(0);
    		if(GetAsyncKeyState(VK_CONTROL)&0x8000){
            	if(GetAsyncKeyState(VK_F5)&0x8000){
					jz();
            	}
        	}
		}
		Sleep(250);
	}
}

int main(){
	thread t(t1);
	t.detach();
    while(_kbhit())_getch();
    while(1){
    	auto now=chrono::system_clock::now();
        time_t tt=chrono::system_clock::to_time_t(now);
        tm* local=localtime(&tt);
        cout<<"\r"<<setw(4)<<setfill('0')<<local->tm_year+1900<<"-"<<setw(2)<<setfill('0')<<local->tm_mon+1<<"-"<<setw(2)<<setfill('0')<<local->tm_mday<<string(2,' ')<<setw(2)<<setfill('0')<<local->tm_hour<<":"<<setw(2)<<setfill('0')<<local->tm_min << ":"<<setw(2)<<setfill('0')<<local->tm_sec;
		Sleep(1000);
	}
    return 0;
}
